{% extends "base.html" %}{% block content %}<div class="container py-4" style="max-width:560px"><div class="cf-card cf-card-b"><h3>Your profile</h3><div id="msg"></div>
<form id="f" class="row g-2"><div class="col-6"><label class="form-label">First name</label><input class="form-control" name="first_name"></div><div class="col-6"><label class="form-label">Last name</label><input class="form-control" name="last_name"></div>
<div class="col-12"><label class="form-label">Email</label><input class="form-control" id="email" disabled></div>
<div class="col-6"><label class="form-label">Phone</label><input class="form-control" name="phone_number"></div><div class="col-6"><label class="form-label">Ward</label><input class="form-control" name="ward"></div>
<div class="col-12 form-check ms-1"><input class="form-check-input" type="checkbox" id="lc"><label class="form-check-label" for="lc">Allow location features (current location, nearby issues, address lookup via OpenStreetMap)</label></div>
<div class="col-12"><span class="badge bg-secondary" id="role"></span></div><div class="col-12"><button class="btn btn-primary">Save changes</button></div></form></div></div>{% endblock %}
{% block scripts %}<script>
CF.api('/auth/me/').then(u=>{for(const k of ['first_name','last_name','phone_number','ward'])f.elements[k].value=u[k]||'';email.value=u.email;role.textContent=u.role;lc.checked=u.location_consent});
lc.onchange=async()=>{try{await CF.consent.set(lc.checked);CF.alert(msg,lc.checked?'Location features allowed.':'Location features turned off.','success')}catch(x){CF.alert(msg,CF.errText(x))}};
f.onsubmit=async e=>{e.preventDefault();try{await CF.api('/auth/me/',{method:'PATCH',body:Object.fromEntries(new FormData(f))});CF.alert(msg,'Profile updated.','success')}catch(x){CF.alert(msg,CF.errText(x))}};
</script>{% endblock %}
